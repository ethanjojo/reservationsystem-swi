name: Project checks
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: bookerdoc
          POSTGRES_PASSWORD: bookerdoc_local
          POSTGRES_DB: bookerdoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookerdoc -d bookerdoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bookerdoc:bookerdoc_local@localhost:5432/bookerdoc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
