name: bookerdoc
services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: bookerdoc
      POSTGRES_PASSWORD: bookerdoc_local
      POSTGRES_DB: bookerdoc
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookerdoc -d bookerdoc"]
      interval: 2s
      timeout: 5s
      retries: 20
  db-test:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: bookerdoc
      POSTGRES_PASSWORD: bookerdoc_local
      POSTGRES_DB: bookerdoc_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookerdoc -d bookerdoc_test"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  db-data:
